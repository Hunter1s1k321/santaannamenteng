<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PD Santa Anna Menteng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('./assets/aftersubmit.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(101, 67, 33, 0.85) 0%,
                rgba(139, 90, 43, 0.8) 25%,
                rgba(160, 111, 63, 0.75) 50%,
                rgba(139, 90, 43, 0.8) 75%,
                rgba(101, 67, 33, 0.85) 100%);
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 0.95; }
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 800px;
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 24px;
            color: #f4e4c1;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .cross-symbol {
            font-size: 48px;
            color: #d4a574;
            margin-bottom: 30px;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(212, 165, 116, 0.5),
                             0 0 20px rgba(212, 165, 116, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(212, 165, 116, 0.8),
                             0 0 40px rgba(212, 165, 116, 0.5),
                             0 0 60px rgba(212, 165, 116, 0.3);
            }
        }

        .quote-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            border: 2px solid rgba(212, 165, 116, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: floatQuote 4s ease-in-out infinite;
        }

        @keyframes floatQuote {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .quote {
            font-size: 28px;
            color: #f4e4c1;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .quote-author {
            font-size: 18px;
            color: #d4a574;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .start-button {
            margin-top: 50px;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #8B5A2B 0%, #654321 100%);
            border: 3px solid #d4a574;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.4);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .start-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .start-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(139, 90, 43, 0.6),
                        0 0 30px rgba(212, 165, 116, 0.4);
            border-color: #f4e4c1;
        }

        .start-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .decorative-line {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4a574, transparent);
            margin: 20px auto;
            animation: expandLine 2s ease-in-out infinite;
        }

        @keyframes expandLine {
            0%, 100% { width: 150px; }
            50% { width: 200px; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 165, 116, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Generate particles */
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 15s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 13s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; animation-duration: 14s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 16s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; animation-duration: 11s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2.5s; animation-duration: 13s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 4.5s; animation-duration: 15s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1.5s; animation-duration: 12s; }

        @media (max-width: 768px) {
            .quote {
                font-size: 20px;
            }
            .start-button {
                padding: 15px 40px;
                font-size: 16px;
            }
        }
    

        /* Perbaikan responsif: halaman HP dapat digulir sampai tombol */
        html {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .splash-container {
            min-height: 100vh;
            min-height: 100dvh;
            height: auto;
            padding: 24px 16px;
            overflow: visible;
        }

        .content {
            width: 100%;
            max-width: 800px;
            padding: 24px;
            flex: 0 0 auto;
        }

        .particles {
            pointer-events: none;
        }

        .start-button {
            z-index: 3;
            min-height: 54px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) {
            .splash-container {
                justify-content: flex-start;
                padding: 16px 12px 28px;
            }

            .content {
                padding: 10px 8px;
                margin: auto 0;
            }

            .logo {
                font-size: 21px;
                margin-bottom: 8px;
            }

            .cross-symbol {
                font-size: 38px;
                margin-bottom: 10px;
            }

            .quote-container {
                padding: 22px 18px;
                margin: 12px 0;
                border-radius: 18px;
            }

            .quote {
                font-size: clamp(17px, 4.8vw, 20px);
                line-height: 1.45;
                margin-bottom: 10px;
            }

            .decorative-line {
                margin: 13px auto;
                max-width: 70%;
            }

            .quote-author {
                font-size: 15px;
                line-height: 1.35;
                margin-top: 12px;
                letter-spacing: 1.5px;
            }

            .start-button {
                display: block;
                width: min(100%, 420px);
                margin: 14px auto 8px;
                padding: 15px 18px;
                font-size: 15px;
                letter-spacing: 1.5px;
                white-space: normal;
            }
        }

        /* HP dengan tinggi layar pendek */
        @media (max-width: 768px) and (max-height: 700px) {
            .splash-container {
                padding-top: 10px;
                padding-bottom: 18px;
            }

            .content {
                padding-top: 4px;
                padding-bottom: 4px;
            }

            .logo {
                margin-bottom: 4px;
            }

            .cross-symbol {
                font-size: 30px;
                margin-bottom: 6px;
            }

            .quote-container {
                padding: 16px 14px;
                margin: 8px 0;
            }

            .quote {
                font-size: 16px;
                line-height: 1.35;
            }

            .decorative-line {
                margin: 9px auto;
            }

            .quote-author {
                font-size: 14px;
                margin-top: 8px;
            }

            .start-button {
                margin-top: 8px;
                min-height: 50px;
                padding: 13px 16px;
            }
        }
    
        /* FINAL FIX: tombol selalu terlihat di HP, halaman tetap dapat discroll */
        @media (max-width: 768px) {
            html, body {
                width: 100%;
                height: auto !important;
                min-height: 100%;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }

            body {
                position: relative;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: auto;
            }

            .splash-container {
                display: flex;
                position: relative;
                width: 100%;
                height: auto !important;
                min-height: 100vh;
                min-height: 100svh;
                padding: 14px 12px calc(100px + env(safe-area-inset-bottom));
                justify-content: flex-start;
                align-items: center;
                overflow: visible;
            }

            .content {
                width: 100%;
                max-width: 620px;
                margin: 0 auto;
                padding: 8px 4px 12px;
                animation: none !important;
                transform: none !important;
            }

            .logo { margin-bottom: 6px; }
            .cross-symbol { margin-bottom: 8px; }

            .quote-container {
                width: 100%;
                padding: clamp(16px, 4vw, 24px) clamp(14px, 4vw, 22px);
                margin: 10px 0 14px;
                animation: none !important;
                transform: none !important;
            }

            .quote {
                font-size: clamp(16px, 4.5vw, 20px);
                line-height: 1.4;
            }

            .quote-author {
                font-size: clamp(13px, 3.7vw, 16px);
                line-height: 1.35;
            }

            .overlay, .logo, .cross-symbol, .decorative-line, .particle {
                animation: none !important;
            }

            .particles { pointer-events: none; }

            /* Tombol tetap terlihat meskipun panel sambutan lebih tinggi dari layar */
            .start-button {
                position: fixed !important;
                left: 50%;
                bottom: calc(12px + env(safe-area-inset-bottom));
                transform: translateX(-50%);
                z-index: 20;
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(100% - 32px);
                max-width: 440px;
                min-height: 56px;
                margin: 0;
                padding: 13px 16px;
                font-size: 15px;
                line-height: 1.2;
                letter-spacing: 1px;
                white-space: normal;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                box-shadow: 0 5px 22px rgba(0,0,0,.45);
            }

            .start-button:active {
                transform: translateX(-50%) scale(.98);
            }
        }

        @media (max-width: 380px) {
            .quote-container { padding: 15px 12px; }
            .quote { font-size: 16px; }
            .start-button { font-size: 14px; min-height: 54px; }
        }


        /* MOBILE CLEAN FIX: scroll normal, tombol tetap di alur halaman */
        @media (max-width: 768px) {
            html {
                height: auto !important;
                min-height: 100%;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }

            body {
                height: auto !important;
                min-height: 100vh;
                min-height: 100svh;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                position: relative;
                -webkit-overflow-scrolling: touch;
            }

            .splash-container {
                height: auto !important;
                min-height: 100vh;
                min-height: 100svh;
                width: 100%;
                padding: 16px 12px calc(24px + env(safe-area-inset-bottom));
                justify-content: flex-start;
                align-items: center;
                overflow: visible !important;
                animation: none !important;
            }

            .overlay,
            .logo,
            .cross-symbol,
            .quote-container,
            .decorative-line,
            .particle,
            .content {
                animation: none !important;
            }

            .overlay,
            .particles {
                pointer-events: none !important;
            }

            .content {
                width: 100%;
                max-width: 620px;
                margin: auto 0;
                padding: 8px 4px;
                transform: none !important;
                filter: none !important;
            }

            .logo {
                font-size: 21px;
                margin-bottom: 8px;
            }

            .cross-symbol {
                font-size: 36px;
                margin-bottom: 10px;
            }

            .quote-container {
                width: 100%;
                padding: 20px 16px;
                margin: 10px 0 14px;
                transform: none !important;
            }

            .quote {
                font-size: clamp(16px, 4.5vw, 20px);
                line-height: 1.4;
            }

            .decorative-line {
                margin: 12px auto;
            }

            .quote-author {
                font-size: clamp(13px, 3.7vw, 16px);
                line-height: 1.35;
                letter-spacing: 1.2px;
            }

            .start-button {
                position: relative !important;
                inset: auto !important;
                display: flex !important;
                width: min(100%, 420px);
                min-height: 56px;
                margin: 14px auto 8px !important;
                padding: 14px 16px;
                align-items: center;
                justify-content: center;
                transform: none !important;
                animation: none !important;
                font-size: 15px;
                line-height: 1.25;
                letter-spacing: 1px;
                white-space: normal;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                z-index: 5;
            }

            .start-button::before {
                pointer-events: none;
            }
        }

        @media (max-width: 768px) and (max-height: 700px) {
            .splash-container { padding-top: 8px; }
            .content { padding-top: 4px; padding-bottom: 4px; }
            .logo { margin-bottom: 4px; }
            .cross-symbol { font-size: 30px; margin-bottom: 6px; }
            .quote-container { padding: 15px 13px; margin: 7px 0 10px; }
            .quote { font-size: 16px; line-height: 1.35; }
            .decorative-line { margin: 8px auto; }
            .quote-author { font-size: 13px; margin-top: 7px; }
            .start-button { margin-top: 9px !important; min-height: 52px; }
        }

</style>
</head>
<body>
    <div class="splash-container">
        <div class="overlay"></div>
        
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="content">
            <div class="logo">✟ Salve ✟</div>
            <div class="cross-symbol">†</div>
            
            <div class="quote-container">
                <div class="quote">
                    "Datang sebagai saudara,<br>
                    pulang dengan iman yang dikuatkan."<br><br>
                    Mari Datang...<br>
                    PD Kamis 19 November Jam 10.30
                </div>
                <div class="decorative-line"></div>
                <div class="quote-author">Bersama PD Santa Anna Menteng.</div>
            </div>

            <button class="start-button" onclick="startRegistration()">
                <span>✟ Mulai Mendaftar ✟</span>
            </button>
        </div>
    </div>

    <script>
        function startRegistration() {
            document.querySelector('.content').style.animation = 'fadeOut 0.8s ease-out forwards';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        }

        // Additional fade out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translateY(-30px) scale(0.95);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
